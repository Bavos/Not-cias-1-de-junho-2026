title: "Brasil e Mundo Agora"
slug: "brasil-mundo-agora-35s"
year: 2026
durationSeconds: 35

format:
  platform: "TikTok/Reels/Shorts"
  width: 1080
  height: 1920
  fps: 30
  audio: false
  binaryImages: false

style:
  category: "jornalístico viral TikTok"
  tone: "urgente, neutro, rápido e informativo"
  visualLanguage:
    - "cards de manchete"
    - "ticker jornalístico"
    - "zoom rápido"
    - "cortes secos"
    - "textos grandes"
    - "movimentos laterais"
    - "barra de progresso"
  fonts:
    primary: "Inter"
    secondary: "Poppins"
    fallback: "Arial, sans-serif"
  colors:
    background: "#080B12"
    surface: "#111827"
    alert: "#EA4335"
    blue: "#4285F4"
    yellow: "#FBBC05"
    green: "#34A853"
    white: "#FFFFFF"
    muted: "#9CA3AF"

scenes:
  - id: "intro"
    file: "scenes/Intro.tsx"
    startSecond: 0
    endSecond: 3
    title: "Abertura"
    text:
      primary: "🚨 BRASIL E MUNDO AGORA"
      secondary: "Resumo rápido das principais notícias"

  - id: "politica-pec"
    file: "scenes/NewsBlock.tsx"
    startSecond: 3
    endSecond: 8
    topic: "Política Brasil"
    icon: "🏛️"
    headline: "PEC 6x1 chega ao Senado"
    bullets:
      - "Negociação intensa após aprovação na Câmara"
      - "Textos alternativos discutem transição"
      - "Jornadas flexíveis entram no debate"
    emphasis:
      label: "BRASIL"
      color: "#4285F4"

  - id: "sucessao-2026"
    file: "scenes/NewsBlock.tsx"
    startSecond: 8
    endSecond: 12
    topic: "Sucessão Presidencial"
    icon: "🗳️"
    headline: "Rachas na articulação conservadora"
    bullets:
      - "PSD descarta chapa Zema + Caiado"
      - "Bastidores de 2026 seguem em disputa"
    emphasis:
      label: "POLÍTICA"
      color: "#FBBC05"

  - id: "seguranca-rj"
    file: "scenes/NewsBlock.tsx"
    startSecond: 12
    endSecond: 16
    topic: "Segurança RJ"
    icon: "🚨"
    headline: "Escutas no Palácio Guanabara"
    bullets:
      - "Dispositivos encontrados no gabinete do governador"
      - "Investigação sigilosa apura origem"
    emphasis:
      label: "ALERTA"
      color: "#EA4335"

  - id: "economia-clima"
    file: "scenes/NewsBlock.tsx"
    startSecond: 16
    endSecond: 21
    topic: "Economia e Clima"
    icon: "🚜"
    headline: "Agro se prepara para Super El Niño"
    bullets:
      - "Setor reavalia logística e proteção hídrica"
      - "Cemaden alerta Manaus e Boa Vista"
      - "Risco de chuvas, inundações e deslizamentos"
    emphasis:
      label: "CLIMA"
      color: "#34A853"

  - id: "colombia"
    file: "scenes/NewsBlock.tsx"
    startSecond: 21
    endSecond: 26
    topic: "América do Sul"
    icon: "🇨🇴"
    headline: "Colômbia vai ao 2º turno"
    bullets:
      - "Abelardo de la Espriella lidera contagem prévia"
      - "Iván Cepeda disputa o segundo turno"
      - "Petro contesta resultado prévio"
    emphasis:
      label: "MUNDO"
      color: "#4285F4"

  - id: "geopolitica-ira"
    file: "scenes/NewsBlock.tsx"
    startSecond: 26
    endSecond: 30
    topic: "Geopolítica"
    icon: "🇺🇸🇮🇷"
    headline: "EUA anunciam ataques no sul do Irã"
    bullets:
      - "Alvos incluem radares estratégicos"
      - "Bases de controle de drones foram atingidas"
    emphasis:
      label: "URGENTE"
      color: "#EA4335"

  - id: "esportes-copa"
    file: "scenes/NewsBlock.tsx"
    startSecond: 30
    endSecond: 33
    topic: "Esportes"
    icon: "⚽"
    headline: "Começa o mês da Copa 2026"
    bullets:
      - "EUA, México e Canadá recebem o torneio"
      - "Procura por TVs cresce no varejo"
    emphasis:
      label: "COPA 2026"
      color: "#34A853"

  - id: "cta"
    file: "scenes/CTA.tsx"
    startSecond: 33
    endSecond: 35
    title: "CTA Final"
    text:
      primary: "Quer o briefing diário em 35 segundos?"
      secondary: "Salve, compartilhe e acompanhe as próximas atualizações."
    hashtags:
      - "#Noticias"
      - "#Brasil"
      - "#Mundo"
      - "#Politica"
      - "#Economia"
      - "#Seguranca"
      - "#Copa2026"
      - "#TikTokNews"

components:
  required:
    - "components/BreakingNewsHeader.tsx"
    - "components/NewsCard.tsx"
    - "components/Ticker.tsx"
    - "components/ProgressBar.tsx"
    - "components/TopicBadge.tsx"

workflow:
  download:
    enabled: true
    folder: "workflows/download"
    file: "workflows/download/download-render.json"
    outputFolder: "downloads/generated"
    tempFolder: "downloads/temp"
    payloadExample:
      fileUrl: "https://exemplo.com/video.mp4"
      fileName: "brasil-mundo-agora-35s.mp4"
      videoTitle: "Brasil e Mundo Agora"

git:
  include:
    - "README.md"
    - "package.json"
    - ".gitignore"
    - "remotion/data/news-briefing-2026.yaml"
  exclude:
  "*.mp4"
    - "*.mov"
    - "*.avi"
    - "*.webm"
    - "*.mkv"
    - "downloads/generated/*"
    - "remotion/renders/*"
    
